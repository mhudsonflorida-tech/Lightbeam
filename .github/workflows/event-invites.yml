name: Build Event Invite List

on:
  workflow_dispatch:
    inputs:
      location:
        description: 'City, metro, or region (e.g. "Miami", "Tampa Bay", "South Florida")'
        required: true
        type: string
      sequence_id:
        description: 'Outreach sequence ID to enroll prospects into (leave blank to just see the list)'
        required: false
        type: string
      dry_run:
        description: 'Dry run – show matching prospects without enrolling them'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  event-invites:
    name: Find prospects near "${{ github.event.inputs.location }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Find and enroll prospects
        run: |
          ARGS="--location \"${{ github.event.inputs.location }}\""

          if [ -n "${{ github.event.inputs.sequence_id }}" ]; then
            ARGS="$ARGS --sequence-id ${{ github.event.inputs.sequence_id }}"
          fi

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          eval npx ts-node src/index.ts event-invites $ARGS
        env:
          OUTREACH_CLIENT_ID: ${{ secrets.OUTREACH_CLIENT_ID }}
          OUTREACH_CLIENT_SECRET: ${{ secrets.OUTREACH_CLIENT_SECRET }}
          OUTREACH_ACCESS_TOKEN: ${{ secrets.OUTREACH_ACCESS_TOKEN }}
          OUTREACH_REFRESH_TOKEN: ${{ secrets.OUTREACH_REFRESH_TOKEN }}
          OUTREACH_LOCATION_FIELD: ${{ secrets.OUTREACH_LOCATION_FIELD }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          SYNC_BATCH_SIZE: '50'
          SYNC_CONCURRENCY: '5'
          RATE_LIMIT_DELAY_MS: '500'
